services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"  # Только localhost
    environment:
      - DATABASE_URL=postgresql://cratebin:${DB_PASSWORD:-cratebin}@db:5432/cratebin
      - RATE_LIMIT=100
      - MAX_CONTENT_SIZE=524288
      - CLEANUP_INTERVAL=3600
      - CORS_ORIGINS=http://cratebin.biz,https://cratebin.biz
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3232:3000"  # Только localhost
    environment:
      - PUBLIC_API_URL=http://backend:8080
      - PUBLIC_APP_URL=https://cratebin.biz
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=cratebin
      - POSTGRES_USER=cratebin
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cratebin}  # Из переменной окружения
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    # УБРАЛИ ports - БД доступна только внутри Docker сети!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cratebin"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
