<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Primary Meta Tags -->
		<title>Cratebin - Free Online Pastebin & Code Snippet Sharing</title>
		<meta name="title" content="Cratebin - Free Online Pastebin & Code Snippet Sharing" />
		<meta name="description" content="Share code snippets, logs, and text online with Cratebin. Free pastebin alternative with password protection, auto-expiration, and raw text mode. Self-hosted and open source." />
		<meta name="keywords" content="pastebin, code sharing, snippet sharing, paste code, share text, code snippets, text sharing, online notepad, paste bin, code paste, hastebin alternative, privatebin, snippet manager" />
		<meta name="author" content="Denys Shatin" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://cratebin.biz" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://cratebin.biz/" />
		<meta property="og:title" content="Cratebin - Free Online Pastebin & Code Snippet Sharing" />
		<meta property="og:description" content="Share code snippets, logs, and text online with Cratebin. Free pastebin alternative with password protection and auto-expiration." />
		<meta property="og:image" content="https://cratebin.biz/og-image.png" />
		<meta property="og:site_name" content="Cratebin" />
		
		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://cratebin.biz/" />
		<meta property="twitter:title" content="Cratebin - Free Online Pastebin & Code Snippet Sharing" />
		<meta property="twitter:description" content="Share code snippets, logs, and text online with Cratebin. Free pastebin alternative with password protection and auto-expiration." />
		<meta property="twitter:image" content="https://cratebin.biz/og-image.png" />
		
		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		
		<!-- Schema.org structured data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "Cratebin",
			"url": "https://cratebin.biz",
			"description": "Free online pastebin and code snippet sharing service with password protection, auto-expiration, and raw text mode",
			"applicationCategory": "DeveloperApplication",
			"operatingSystem": "Web",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			},
			"author": {
				"@type": "Person",
				"name": "Denys Shatin"
			},
			"featureList": [
				"Code snippet sharing",
				"Password protection",
				"Auto-expiration (TTL)",
				"Raw text mode",
				"Public, unlisted, and private snippets",
				"Self-hosted and open source"
			]
		}
		</script>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
